<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FFArena - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #080b12;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
      background: #10141c;
      border: 1px solid #292f3a;
      border-radius: 15px;
      padding: 35px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .4);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }

    .logo h1 {
      color: #ffb000;
      font-size: 28px;
      margin-bottom: 7px;
    }

    .logo p {
      color: #8993a5;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #dfe3e8;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #303746;
      border-radius: 8px;
      background: #080b12;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #ffb000;
    }

    input::placeholder {
      color: #68717d;
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: #ffb000;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn:hover {
      background: #ffc433;
    }

    .signup-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #3a1515;
      border: 1px solid #8d3030;
      color: #ffb5b5;
    }

    .message.success {
      display: block;
      background: #12351d;
      border: 1px solid #28743a;
      color: #b5ffc3;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #8993a5;
      font-size: 14px;
    }

    .login-link a {
      color: #ffb000;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #68717d;
      text-decoration: none;
      font-size: 13px;
    }

    .back-home:hover {
      color: white;
    }
  </style>

</head>

<body>

  <div class="auth-container">

```
<div class="logo">
  <img src="/logo.jpg" alt="FFArena">

  <h1>FFArena</h1>

  <p>Create your player account</p>
</div>


<div id="message" class="message"></div>


<form id="signupForm">

  <div class="form-group">
    <label for="username">Username</label>

    <input
      type="text"
      id="username"
      placeholder="Choose a username"
      autocomplete="username"
      maxlength="30"
      required
    >
  </div>


  <div class="form-group">
    <label for="displayName">Display Name</label>

    <input
      type="text"
      id="displayName"
      placeholder="Your display name"
      maxlength="50"
      required
    >
  </div>


  <div class="form-group">
    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >
  </div>


  <div class="form-group">
    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      autocomplete="new-password"
      minlength="6"
      required
    >
  </div>


  <div class="form-group">
    <label for="confirmPassword">Confirm Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Enter your password again"
      autocomplete="new-password"
      minlength="6"
      required
    >
  </div>


  <button
    type="submit"
    class="signup-btn"
    id="signupBtn"
  >
    Create Account
  </button>

</form>


<div class="login-link">
  Already have an account?
  <a href="/login.html">Login</a>
</div>


<a
  href="/index.html"
  class="back-home"
>
  ← Back to FFArena
</a>
```

  </div>

  <script>

    /*
      We are NOT putting the Supabase secret/service key
      in this page.

      The browser talks to our server.
      Our server talks to Supabase.
    */


    const signupForm =
      document.getElementById("signupForm");

    const signupBtn =
      document.getElementById("signupBtn");

    const messageBox =
      document.getElementById("message");


    function showMessage(text, type) {

      messageBox.textContent = text;

      messageBox.className =
        "message " + type;

    }


    signupForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const username =
          document
            .getElementById("username")
            .value
            .trim();

        const displayName =
          document
            .getElementById("displayName")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        if (
          !username ||
          !displayName ||
          !email ||
          !password ||
          !confirmPassword
        ) {

          showMessage(
            "Please fill in all fields.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        signupBtn.disabled = true;

        signupBtn.textContent =
          "Creating account...";


        try {

          const response =
            await fetch("/api/auth/signup", {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                username,
                display_name: displayName,
                email,
                password
              })

            });


          const result =
            await response.json();


          if (!response.ok) {

            showMessage(
              result.error ||
              "Unable to create account.",
              "error"
            );

            signupBtn.disabled = false;

            signupBtn.textContent =
              "Create Account";

            return;
          }


          showMessage(
            result.message ||
            "Account created successfully!",
            "success"
          );


          signupForm.reset();


          setTimeout(() => {

            window.location.href =
              "/login.html";

          }, 2000);


        } catch (error) {

          console.error(
            "Signup error:",
            error
          );

          showMessage(
            "Unable to connect to the server. Make sure FFArena is running.",
            "error"
          );

          signupBtn.disabled = false;

          signupBtn.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>
</html>
